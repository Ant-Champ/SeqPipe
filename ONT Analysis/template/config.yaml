# ======================================================================
# NanoForge :: run configuration
# ======================================================================

# --- I/O paths --------------------------------------------------------
out_dir      : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/Runs/WGS_KEIO_CHLOR/results/"
fastq_dir    : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/Runs/WGS_KEIO_CHLOR/fastq/"
sample_sheet : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/Runs/WGS_KEIO_CHLOR/sample_sheet.tsv"
ref_dir      : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/Runs/WGS_KEIO_CHLOR/genbank_files/"

# Prefix prepended to each barcode to build the FASTQ filename, i.e.
#   {fastq_dir}{fastq_base_name}{barcode}.fastq.gz
# Use "" if your files are just {barcode}.fastq.gz
fastq_base_name : ""

# --- analysis toggles (apply to the whole run, not per sample) --------
# Enable any combination of the three branches below.
run_alignment_analysis : true    # medaka variant calling vs. a reference
run_denovo_assembly    : true   # Flye de novo assembly, no reference needed
run_plasmid_screen     : true   # map reads against a shared plasmid panel

# Only used when run_alignment_analysis is true:
run_coverage_analysis  : true    # samtools depth + low-coverage detection, plus a
                                  # per-replicon breadth/depth summary (-> coverage_summary.tsv)
run_multimer_analysis  : true    # multimer / concatemer detection
run_gatc_annotation    : true    # GATC-site ID + gene annotation (final annotated table)

# --- analysis scripts -------------------------------------------------
script_dir : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/NanoForgeFolder/scripts"
script:
  id_gatc    : "id_GATC.1.py"
  annotate   : "annotate.1.py"
  simplify   : "simplify.4.py"
  coverage   : "coverage.4.py"
  merge      : "merge_diff.1.py"
  sync       : "sync.2.py"
  multimer   : "multimer.2.py"
  summary   : "summary.2.py"
  coverage_summary : "aggregate_coverage.1.py"

# --- read filtering ---------------------------------------------------
filter_mode          : "best95per"   # best95per | best95per_max100x | none
filtlong_min_length  : 500
filtlong_keep_percent: 95

# --- staging ----------------------------------------------------------
stage_mode : "symlink"   # symlink (saves disk) | copy

# --- variant calling --------------------------------------------------
simplify_min_qual     : 50
coverage_low_threshold: 5

# --- multimer calling --------------------------------------------------
multimer_threads: 4
multimer_min_fraction: 0.02   # % of full-length reads that must be concatemeric
multimer_min_reads: 5
multimer_junction_tol: 0.02   # junction slack, fraction of L (floor 50 bp)
multimer_min_query_cov: 0.8
multimer_length_cut: 1.5      # read/L ratio above which a read is concatemeric

# --- de novo assembly (Flye) -------------------------------------------
# Only used when run_denovo_assembly is true. Samples with more than one
# replicon (e.g. chromosome + plasmid) are expected to yield multiple
# contigs -- see <sample>.assembly_info.txt for the per-contig breakdown.
flye_read_mode   : "--nano-raw"   # --nano-raw | --nano-hq | --nano-corr (match your basecaller)
flye_threads     : 4
flye_mem_mb      : 8000
flye_runtime     : 180             # minutes (SLURM)
flye_min_coverage: 10              # skip assembly (no Flye crash) if filtered read yield is
                                    # below this x the sample's reference length -- e.g. a
                                    # sample with too little data relative to its target size
                                    # gets a clearly-labeled empty result instead of failing
                                    # the run. Lower it if you want Flye to at least attempt
                                    # marginal-depth samples.

# --- plasmid panel screening --------------------------------------------
# Only used when run_plasmid_screen is true. Drop one or more .fasta/.fa
# files into plasmid_panel_dir, one per candidate plasmid (or several
# records in one file) -- every sample's filtered reads get mapped
# against the whole panel and per-plasmid coverage feeds into
# <out_dir>/coverage_summary.tsv (one row per sample x plasmid, alongside
# the reference-genome rows from run_coverage_analysis if that's also on).
plasmid_panel_dir     : "/net/nfs-bio/home/def-rodrigu1/antoine9/ont/Runs/WGS_KEIO_CHLOR/plasmid_panel/"
plasmid_screen_threads: 4
plasmid_screen_mem_mb : 4000
plasmid_screen_runtime: 30       # minutes (SLURM)


# --- Chlor cassettes location finder  --------------------------------------------
# Exact FASTA record name shown by:
# samtools idxstats OUT_DIR/<sample>/<sample>.plasmid_panel.sorted.bam
chlor_cassette_reference: "Chlor_cassette"

# Hotspot definition
chlor_hotspot_max_gap: 1000
chlor_hotspot_flank: 500
chlor_hotspot_min_reads: 2

# Path to the IGV launcher. Example:
# igv_exe: "/home/yourname/IGV_Linux_*/igv.sh"
igv_exe: "/net/nfs-bio/home/antoine9/softwares/igv/igv.sh"

