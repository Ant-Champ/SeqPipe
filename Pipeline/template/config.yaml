# ======================================================================
# Run configuration -- copy this file into your run folder and edit it.
#   cp <pipeline>/template/config.yaml  <run folder>/config.yaml
# Paths: absolute paths are safest.
# EVERY option of the pipeline is listed here, set to its default value
# (a key left out of your config also takes this default).
# ======================================================================

# --- I/O paths --------------------------------------------------------
out_dir      : "/path/to/run/results/"
sample_sheet : "/path/to/run/sample_sheet.tsv"
ref_dir      : "/path/to/run/genbank_files/"    # GenBank references (.gb), see `reference` column
# The FASTQ files and the reference of each sample are given in the sample
# sheet (full paths in reads1 / reads2, reference name in `reference`).
# Nothing has a default: an empty or wrong entry stops the run before it starts.

# --- analysis toggles (apply to the whole run, not per sample) --------
# Alignment to each sample's reference, read statistics and summary.tsv
# always run. Steps that don't apply to a read type are skipped for it.
run_read_filtering    : true    # ONT: filtlong   | short reads: fastp
run_variant_calling   : true    # ONT: medaka     | short reads: bcftools  -> <sample>.simple.tsv
run_gatc_annotation   : true    #   + GATC-site and gene annotation (needs run_variant_calling)
run_coverage_analysis : true    # coverage per replicon + annotated low- and high-coverage regions
run_sv_scan           : true    # large indels + breakpoints (deleted / moved regions), annotated
run_multimer_analysis : true    # multimer / concatemer detection (ONT samples only)
run_denovo_assembly   : false   # ONT: Flye       | short reads: Unicycler
run_plasmid_screen    : false   # map reads against a shared panel of plasmids (plasmid_panel_dir)
run_cassette_search   : false   # where the cassettes of cassette_dir are inserted in the genome (all samples, all cassettes)
run_hotspot_pictures  : false   #   + a picture of each cassette hotspot (reads, clips, mates; drawn by the pipeline)
run_html_report       : true    # <out_dir>/report.html: every result by sample / by analysis, coverage plots, hotspot pictures

# --- general ------------------------------------------------------------
stage_mode : "symlink"   # symlink (saves disk) | copy -- how raw FASTQs are brought into out_dir
min_mapq   : 20          # minimum mapping quality (low coverage, SV scan, short-read variant calling)

# --- depth check (low diversity) -----------------------------------------
# theoretical depth = filtered bases / reference length. Below this the sample
# is "low_diversity": QC only, no alignment / analysis, red banner in the
# report, status column in summary.tsv. 0 = off.
min_theoretical_depth : 5

# --- threads / memory per job ---------------------------------------------
# Jobs share the salloc allocation: run.sh gives snakemake all its CPUs and
# memory, and runs as many jobs at once as fit.
align_threads   : 8
align_mem_mb    : 16000
medaka_threads  : 4
medaka_mem_mb   : 8000
fastp_threads   : 4

# --- read filtering -------------------------------------------------------
# ONT (filtlong)
filter_mode          : "best95per"   # best95per | best95per_max100x | none
filtlong_min_length  : 500
filtlong_keep_percent: 95
# short reads (fastp)
fastp_min_length : 30
fastp_min_qual   : 20     # trim 3' ends below this mean quality

# --- variant calling ------------------------------------------------------
simplify_min_qual  : 50    # ONT (medaka): keep variants seen in MORE than this % of reads (despite the name, not a QUAL)
bcftools_min_qual  : 30    # short reads (bcftools): minimum QUAL
bcftools_min_baseq : 20
bcftools_max_depth : 10000

# --- low-coverage regions (deletions) --------------------------------------
# RELATIVE threshold with a fixed floor: a base is "low" if its depth,
# averaged over lowcov_smooth bp, is
#   < max(lowcov_min_depth, lowcov_frac x median depth)
# but the threshold is never above lowcov_max_thr_frac x median (at a median of
# 8x, a floor of 5x would call ordinary depth dips "low" all over the genome).
# median depth = over the whole reference (all replicons, unmappable bases excluded).
# e.g. median 80x -> low below max(10, 20) = 20x ; median 30x -> below 10x ;
#      median 8x  -> max(10, 2) = 10, capped at 4x.
lowcov_min_depth : 10     # fixed floor (x)
lowcov_frac      : 0.25   # fraction of the median depth
lowcov_max_thr_frac : 0.5 # the threshold never exceeds this x the median
lowcov_smooth    : 50     # average depth over this many bp before calling "low" (1 = per base)
lowcov_min_len   : 20     # report only regions at least this long (bp); e.g. 500 for gene-size deletions only
lowcov_merge_gap : 10     # merge low regions closer than this (bp, unmasked), before the length filter
lowcov_region_max_frac : 0.25  # drop a region whose mean depth is above this x the median
                               # (a real deletion is ~0x all along; a cluster of dips is not)

# Mappability mask (short reads only): perfect PE reads are simulated from each
# reference and mapped back with bwa-mem2; bases they cannot cover with
# MAPQ >= min_mapq (repeats: rRNA operons, IS elements...) are ignored by the
# low-coverage scan. Computed once per reference and read settings.
run_mappability_filter : true
mappability_read_len   : 75     # your read length (PE75)
mappability_insert     : 300    # typical fragment length (bp)
mappability_step       : 2      # one simulated pair every N bp (1 = finest, slower)
mappability_min_frac   : 0.5    # unmappable below this fraction of the expected simulated depth
mappability_dir        : ""     # "" = <out_dir>/mappability/ ; set a shared folder (e.g. <ref_dir>/mappability) to reuse between runs

# --- high-coverage regions (duplications, amplifications) -----------------
# The replicon is cut into highcov_window bp windows; a window is "high" if
# its mean depth > highcov_frac x the median depth OF ITS OWN REPLICON (so a
# multicopy plasmid is not flagged as a whole). fold ~2 = one extra copy.
highcov_frac      : 1.7    # 1.7 catches a duplication (2x) despite depth noise
highcov_window    : 100    # bp
highcov_min_len   : 1000   # report only regions at least this long (bp)
highcov_merge_gap : 300    # merge high regions closer than this (bp), before the length filter
annotate_skip_types : "source,gene"   # GenBank feature types ignored when annotating

# --- large indels / breakpoints (per read type) ---------------------------
sv_scan:
  short:
    min_indel   : 10    # minimum CIGAR indel size (bp)
    min_clip    : 20    # minimum soft-clip length for a breakpoint (bp)
    min_support : 3     # minimum reads supporting an event
    cluster_tol : 5     # position tolerance when clustering (bp)
  ont:
    min_indel   : 30
    min_clip    : 200
    min_support : 3
    cluster_tol : 20
sv_ignore_contig_ends : 10   # drop breakpoints this close to a contig end (reads crossing the
                             # origin of a circular replicon); 0 keeps them (linear replicons)

# --- multimer calling (ONT) -----------------------------------------------
multimer_threads      : 4
multimer_mem_mb       : 4000
multimer_min_fraction : 0.02   # fraction of full-length reads that must be concatemeric
multimer_min_reads    : 5
multimer_junction_tol : 0.02   # junction slack, fraction of L (floor 50 bp)
multimer_min_query_cov: 0.8
multimer_length_cut   : 1.5    # read/L ratio above which a read is concatemeric
multimer_extra_columns: false  # also add multimer_copies / multimer_pct to the annotated table
multimer_column_name  : "multimer"   # name of the column added to the annotated variant table

# --- de novo assembly -----------------------------------------------------
# Samples with several replicons (chromosome + plasmid) give several contigs:
# see <sample>.assembly_info.txt.
flye_read_mode   : "--nano-raw"  # --nano-raw | --nano-hq | --nano-corr (match your basecaller)
flye_threads     : 8
flye_mem_mb      : 16000
flye_min_coverage: 10            # skip (clearly-labelled empty result) below this x reference length
unicycler_threads: 8
unicycler_mem_mb : 16000
unicycler_mode   : "normal"      # conservative | normal | bold
unicycler_min_coverage: 10       # as flye_min_coverage, for short reads (R1 + R2 bases)

# --- plasmid panel screening ----------------------------------------------
# Folder of GenBank or FASTA files (.gb/.gbk/.genbank/.fasta/.fa/.fna), one
# per candidate plasmid, named after the file (file_recordid if a file holds
# several records). Use an ABSOLUTE path: a relative one is read from this
# config's folder. Every sample's reads are mapped against the whole panel;
# per-plasmid coverage goes into <out_dir>/coverage_summary.tsv.
plasmid_panel_dir     : ""
plasmid_screen_threads: 4
plasmid_screen_mem_mb : 4000

# --- cassette search (run_cassette_search) ---------------------------------
# One GenBank (.gb/.gbk) or FASTA (.fasta/.fa) file per cassette; the file name
# (without extension) is the cassette name in every output. ALL cassettes in the
# folder are searched in every sample, together, so that the regions cassettes
# share (e.g. Keio FRT / priming-site ends) are recognised as ambiguous.
cassette_dir       : "/home/antoine9/Pipeline/references/cassettes/"
cassette_min_mapq  : 20      # read evidence below this mapping quality cannot name the cassette
cassette_min_reads : 2       # minimum junction reads for a junction
cassette_max_span  : 20000   # max distance between the two junctions of one insertion site (bp)
cassette_min_clip  : 20      # soft clips at least this long are junction evidence (shorter ones match the genome by chance)
cassette_hotspot_gap : 1000       # hotspots: evidence (mates, clips, junction reads) closer than this is one hotspot (bp)
cassette_hotspot_min_reads : 3    # hotspots: minimum reads; each hotspot gets a picture (run_hotspot_pictures)
cassette_hotspot_min_junction_reads : 2   # ... of which reads over a junction (clip / split); mates alone are not a hotspot
cassette_mate_window : 1000  # short reads: read pairs this close to a junction (genome mate) name its cassette when the junction reads cannot (shared ends)
# per read type: minimum aligned length on each side of a junction, junction clustering tolerance
cassette_min_segment_ont   : 100
cassette_min_segment_short : 30
cassette_cluster_tol_ont   : 20
cassette_cluster_tol_short : 10

# Hotspot pictures (run_hotspot_pictures): drawn by scripts/snapshot_regions.py
# (matplotlib): genes, depth, reads with soft clips / mates on a cassette / split reads.
picture_flank : 1000   # bp shown on each side of a hotspot
picture_max_view : 10000       # widest picture (bp): a longer hotspot is shown around its best junction
picture_max_per_sample : 50    # most pictures per sample (hotspots with most reads first)
picture_debug : false          # true: also <picture>.png.reads.tsv, every read in the picture (pictures_debug.tsv is always written)

# --- HTML report (run_html_report) ----------------------------------------
report_max_bins  : 20000  # depth points per replicon in the plots (4.6 Mb genome -> 230 bp per point)
report_embed_pictures : true   # hotspot pictures inside report.html (false: links to the PNGs, smaller file)

# --- analysis scripts (optional) -------------------------------------------
# Scripts are taken from <pipeline>/scripts (or script_dir if set). To try
# another version of a script, put it there and name it under `script:`.
# The keys and their default scripts:
#   simplify: simplify.4.py               simplify_bcftools: simplify_bcftools.py
#   id_gatc: id_GATC.2.py                 annotate: annotate.2.py
#   multimer_flag: add_multimer_column.1.py   multimer: multimer.2.py
#   lowcov: lowcov.py                     sv_scan: sv_scan.py
#   annotate_regions: annotate_regions.py coverage_summary: aggregate_coverage.1.py
#   find_cassette_insertions: find_cassette_insertions.py
#   snapshot_regions: snapshot_regions.py mappability: mappability.py
script_dir : ""
script: {}               # e.g.  script: {simplify: "simplify.5.py"}
